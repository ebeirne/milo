# Local development only. The database port is bound to loopback.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: familiar
      POSTGRES_USER: familiar
      POSTGRES_PASSWORD: familiar_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - familiar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familiar -d familiar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  familiar_postgres:
